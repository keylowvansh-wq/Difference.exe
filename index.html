<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SpotTheDiff.exe</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="os-window" id="mainWindow">
<div class="title-bar" id="titleBar">
<span class="title-text" id="titleText">SpotTheDiff.exe - [Level 1]</span>
<div class="title-controls">
<button class="win-btn">_</button>
<button class="win-btn">□</button>
<button class="win-btn">X</button>
</div>
</div>
<div class="menu-bar">
<span>File</span>
<span>Edit</span>
<span>Help</span>
</div>
<div class="content-area">
<div class="game-container">
<div class="room" id="room">
<div class="wall"></div>
<div class="floor"></div>
<div class="window-frame">
<div class="window-glass" id="winGlass"></div>
<div class="scary-eyes" id="scaryEyes"></div>
</div>
<div class="closet">
<div class="closet-door" id="closetDoor"></div>
<div class="closet-darkness" id="closetDark"></div>
</div>
<div class="bed">
<div class="bed-sheet"></div>
<div class="bed-hand" id="bedHand"></div>
</div>
<div class="poster" id="poster">
<span id="posterText">HAPPY!</span>
</div>
<div class="door">
<div class="door-shadow" id="doorShadow"></div>
</div>
<div class="hotspot" id="h1" style="top: 15%; left: 65%;"></div>
<div class="hotspot" id="h2" style="top: 40%; left: 15%;"></div>
<div class="hotspot" id="h3" style="top: 75%; left: 45%;"></div>
<div class="hotspot" id="h4" style="top: 25%; left: 40%;"></div>
<div class="hotspot" id="h5" style="top: 50%; left: 85%;"></div>
</div>
</div>
<div class="sidebar">
<div class="panel">
<div class="panel-header">Progress</div>
<div class="panel-body">
Found: <span id="score">0</span> / 5
</div>
</div>
<div class="panel">
<div class="panel-header">Message</div>
<div class="panel-body msg-box" id="msgBox">
Find the 5 differences in this cozy room!
</div>
</div>
</div>
</div>
<div class="status-bar">
<span id="statusText">Ready</span>
</div>
</div>
<div id="jumpscare">
<img src="assets/face.jpg" id="jumpImg">
</div>
<script src="script.js"></script>
</body>
</html>
